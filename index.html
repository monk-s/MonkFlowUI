<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MonkFlow — Digital Intake & CRM Sync for RIAs</title>
  <meta name="description" content="MonkFlow builds digital intake forms and CRM sync (Redtail, Wealthbox, Salesforce FSC) for independent advisor firms. Founder-led, fixed-fee, real support." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="MonkFlow — Digital Intake & CRM Sync for RIAs" />
  <meta property="og:description" content="Make your Wealthbox or Redtail fit your practice. Digital intake forms, CRM auto-sync, and signed-PDF generation for independent advisor firms. Fixed-fee, founder-led." />
  <meta property="og:url" content="https://monkflow.io" />
  <meta property="og:image" content="https://monkflow.io/logo.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="MonkFlow — Digital Intake & CRM Sync for RIAs" />
  <meta name="twitter:description" content="Digital intake forms + CRM sync for independent advisor firms. Make your Wealthbox or Redtail fit your practice." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.css" />
  <!-- Asset paths MUST be root-absolute (/foo), not relative (foo). On a
       nested route like /case-studies/team-financial-strategies a relative
       path resolves to /case-studies/app.js, which the vercel.json catch-all
       rewrite serves as index.html — the app then never boots and the page
       renders blank. Single-segment routes (/for-advisors) happen to work
       either way, which is what hid this. Keep the leading slash. -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <meta name="theme-color" content="#00ff88" />
  <link rel="stylesheet" href="/styles.css" />
  <!-- Plausible analytics (privacy-first, no cookie banner). Tagged-events
       build supports manual window.plausible('Event') calls for funnel
       tracking. INERT until monkflow.io is added in the Plausible dashboard —
       no API key needed in code; Plausible identifies by data-domain. -->
  <script defer data-domain="monkflow.io" src="https://plausible.io/js/script.tagged-events.js"></script>
  <script>window.plausible = window.plausible || function () { (window.plausible.q = window.plausible.q || []).push(arguments) };</script>
</head>
<body>
  <!-- LANDING PAGE -->
  <div id="landing-container" class="hidden"></div>

  <!-- AUTH SCREENS -->
  <div id="auth-container" class="hidden">
    <div id="auth-login"></div>
    <div id="auth-signup" class="hidden"></div>
  </div>

  <!-- MAIN APP -->
  <div id="app-container" class="app-layout hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar"></aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <header id="topbar" class="topbar"></header>
      <main id="main-content" class="main-content"></main>
    </div>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal-box"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/app.js"></script>
</body>
</html>
